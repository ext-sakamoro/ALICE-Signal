name: CI

# canonical CI template: [[reference_alice_ci_canonical_template]] (ALICE-SDF base)
# 2026-09-18 ALICE-Signal 用: fmt / clippy -D / test 3 OS + analytic oracle / msrv 実 compile /
# doc -D warnings / actionlint (feature なし crate のため powerset job は無し)

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      # 解析解 oracle (tests/analytic_oracle.rs、CLAUDE.md § 解析解突合テスト規律)
      - name: Analytic oracle
        run: cargo test --test analytic_oracle
      - name: Doc tests
        run: cargo test --doc

  msrv:
    name: MSRV (rust-version = 1.87 実 compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 宣言値と同じ toolchain: Cargo.toml の rust-version を bump したら同 commit で @<version> も更新
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  test-public-siblings:
    name: Test (public siblings)
    runs-on: ubuntu-latest
    env:
      # the passed-test count of the feature set below at the commit that set it;
      # fewer passed tests (a removed or skipped test, or none at all) is a failure
      MIN_PASSED: "207"
    steps:
      # cargo reads the manifest of every path dependency, optional ones included, so
      # each sibling is checked out next to this repository at a fixed commit with the
      # workflow's own token: a sibling that is not public cannot be checked out
      - uses: actions/checkout@v5
        with:
          path: ALICE-Signal
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (lib, integration, doctests)
        working-directory: ALICE-Signal
        run: |
          # the default shell has no pipefail: without it cargo's exit status is lost in the pipe
          set -o pipefail
          log="$(mktemp)"
          cargo test --all-features 2>&1 | tee "${log}"
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED}), failed: ${failed}"
          if [ "${failed}" -ne 0 ] || grep -E '^test result: ' "${log}" | grep -vE '^test result: ok\. ' >/dev/null; then
            echo "::error::${failed} tests failed"
            exit 1
          fi
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi
